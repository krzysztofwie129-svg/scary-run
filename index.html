<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>Scary Run</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a0a2e;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* Disable iOS Safari bounce scroll. */
    body {
      position: fixed;
      top: 0;
      left: 0;
    }

    /* iOS Safari zoom'uje viewport gdy focus na <input>/<textarea> z fontem
       <16px. Wymuszamy 16px na hidden inputach żeby zachować skalę. */
    input, textarea, select {
      font-size: 16px !important;
    }

    /* Domyślnie kontener wypełnia viewport. Phaser scale FIT centeruje canvas. */
    #game-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Klasa dodawana z JS gdy mobile + portrait. JS-driven detection jest
       niezawodne — DevTools emulacja często nie matche'uje
       @media (hover:none) and (pointer:coarse). Wzorzec center/center
       (translate-50 + rotate-90 wokół środka) matematycznie wypełnia
       viewport bez offsetów. */
    #game-container.rotated {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center center;
    }

    canvas {
      display: block !important;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
