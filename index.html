<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>Scary Run</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a0a2e;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* Disable iOS Safari bounce scroll. position:fixed na body sprawia
       że content nie reaguje na scroll-bounce gdy soft keyboard się wysuwa. */
    body {
      position: fixed;
      top: 0;
      left: 0;
    }

    /* iOS Safari zoom'uje viewport gdy focus na <input>/<textarea> z fontem
       <16px. Wymuszamy 16px na hidden inputach żeby zachować skalę. */
    input, textarea, select {
      font-size: 16px !important;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Portrait mobile: obróć kontener tak, żeby gra renderowała się
       w landscape mimo pionowo trzymanego telefonu.
       Wzorzec center/center działa matematycznie poprawnie:
         translate(-50%,-50%) najpierw przesuwa box żeby jego center pokrył się
         z (50%, 50%) viewportu, potem rotate(90deg) wokół tego center.
         Po rotacji box (100vh × 100vw) dokładnie wypełnia viewport (100vw × 100vh).
       Wykrywanie:
         orientation: portrait — pionowy viewport
         hover: none + pointer: coarse — touch device (telefon, nie desktop)
    */
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      #game-container {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }
    }

    canvas {
      display: block !important;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
