<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a0a2e" />

  <!-- PWA — Vite PWA plugin sam wstawia <link rel="manifest"> i SW register. -->
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

  <!-- SEO -->
  <meta name="description" content="Scary Run to gra runner w stylu halloween. Tap UP żeby skoczyć, tap DOWN żeby uniknąć latających dyni. Multiplayer 1-4 graczy, 4 levele, ranking top 10." />

  <!-- Open Graph (Facebook, iMessage, WhatsApp, Discord, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://scaryrun.win" />
  <meta property="og:title" content="SCARY RUN! — Halloween Runner Game" />
  <meta property="og:description" content="Zobacz moją grę! Pobiegnij przez halloweenowe zasadzki!" />
  <meta property="og:image" content="https://scaryrun.win/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="pl_PL" />
  <meta property="og:site_name" content="Scary Run" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SCARY RUN! — Halloween Runner Game" />
  <meta name="twitter:description" content="Zobacz moją grę! Pobiegnij przez halloweenowe zasadzki!" />
  <meta name="twitter:image" content="https://scaryrun.win/og-image.png" />

  <title>Scary Run</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      /* dvh = dynamic viewport height — uwzględnia Safari toolbar/tab
         switcher dynamicznie (gdy Safari ma wiele kart, dolny pasek zjada
         ~50px; vh tego nie respektuje, dvh respektuje). Wymaga iOS Safari
         15.4+ — starsze browser pokazuje fallback z scriptu w body. */
      height: 100dvh;
      background: #1a0a2e;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* NIE używamy env(safe-area-inset-*) na body — w landscape iPhone
       (notch po lewej) padding-left=44 a padding-right=0 jest asymetryczny
       i przesuwa container w prawo. Game canvas zajmuje pełen viewport,
       gra wizualnie może sięgać pod notch (typowe w landscape grach). */

    /* Container = pełen viewport. NIE używamy display:flex bo Phaser
       Scale.FIT + autoCenter:CENTER_BOTH sam ustawia margin canvasa
       — flex + Phaser-center daje konflikt centering => przesunięcie. */
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    canvas {
      display: block !important;
      max-width: 100% !important;
      max-height: 100% !important;
    }

    /* HTML input dla NameInputScene — pojawia się nad canvasem na fokus.
       Natywny element = soft keyboard automatycznie na mobile.
       UWAGA: top: 30% (nie 50%) żeby HTML input nie pokrywał stacking
       context'u przycisku POTWIERDZ na dole — tap na przycisk czasem
       był łapany przez htmlInput jeśli oba w tym samym Y. */
    #name-input-html {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      padding: 8px 20px;
      border: none;
      background: transparent;
      color: #ffe9a8;
      text-align: center;
      width: 380px;
      max-width: 80vw;
      outline: none;
      z-index: 10000;
      display: none;
      font-family: 'Arial Black', sans-serif;
      letter-spacing: 0.08em;
      caret-color: #ffd93c;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }
    #name-input-html.active {
      display: block;
    }
  </style>
</head>
<body>
  <noscript>
    <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#1a0a2e;color:#ffd93c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;text-align:center;padding:20px;">
      <h1 style="font-size:36px;margin-bottom:20px;">SCARY RUN</h1>
      <p style="font-size:18px;color:white;">Wlacz JavaScript w przegladarce zeby zagrac.</p>
    </div>
  </noscript>

  <!-- Fallback dla starych przeglądarek bez ES modules / Phaser init fail.
       Uruchamiany przez script niżej (timeout 5s lub brak noModule support). -->
  <div id="browser-fallback" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#1a0a2e;color:#ffd93c;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;text-align:center;padding:20px;z-index:99999;">
    <h1 style="font-size:36px;margin-bottom:20px;">SCARY RUN</h1>
    <p style="font-size:18px;color:white;margin-bottom:20px;">Twoja przegladarka jest za stara.</p>
    <p style="font-size:16px;color:#aaa;">Otworz strone w nowoczesnym Chrome lub Safari (iOS 15.4+).</p>
  </div>

  <div id="game-container"></div>
  <input id="name-input-html" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" />


  <script>
    // Detection: jeśli za 12s canvas nie istnieje (Phaser nie wystartował),
    // pokaż browser-fallback. 12s żeby PWA Service Worker miał czas na
    // pierwszy fetch + decode dużych assetów na wolnym 4G. Bardzo stare
    // browsery łapią się szybciej przez noModule check niżej.
    setTimeout(function() {
      if (!document.querySelector('canvas')) {
        var fb = document.getElementById('browser-fallback');
        if (fb) fb.style.display = 'flex';
      }
    }, 12000);

    // Bezwarunkowo: brak noModule attribute = stary browser bez ES modules.
    if (!('noModule' in HTMLScriptElement.prototype)) {
      var fb = document.getElementById('browser-fallback');
      if (fb) fb.style.display = 'flex';
    }
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
