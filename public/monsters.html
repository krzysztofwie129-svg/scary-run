<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scary Run — Monster Catalog</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: linear-gradient(180deg, #1a0a2e 0%, #0a0420 100%);
      color: #ffd93c;
      font-family: 'Arial Black', sans-serif;
    }
    h1 {
      text-align: center;
      font-size: 32px;
      margin: 0 0 8px;
      text-shadow: 0 0 20px #ff6b9d;
    }
    .sub {
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #bdaee3;
      margin-bottom: 32px;
    }
    .group-header {
      grid-column: 1 / -1;
      font-size: 22px;
      color: #ffd93c;
      border-bottom: 3px solid #ff6b9d;
      padding: 16px 0 8px;
      margin-top: 24px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      margin: 0 auto;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(45, 27, 78, 0.6);
      border: 2px solid #6b4ea0;
      border-radius: 12px;
      padding: 16px;
    }
    .card.tier-mid    { border-left: 6px solid #4ade80; }
    .card.tier-high   { border-left: 6px solid #b084ff; }
    .card.tier-wall   { border-left: 6px solid #ff6b9d; }
    .card.tier-low    { border-left: 6px solid #ffd93c; }
    .card.tier-static { border-left: 6px solid #8678a8; }
    .preview {
      width: 200px; height: 200px;
      background: #0a0420;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .preview img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
    .info {
      flex: 1;
    }
    .info .name {
      font-size: 22px;
      color: #ffd93c;
      margin-bottom: 4px;
    }
    .info .tier {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
      letter-spacing: 1px;
      margin-right: 6px;
    }
    .tier-badge-mid    { background: #4ade80; color: #1a0a2e; }
    .tier-badge-high   { background: #b084ff; color: #1a0a2e; }
    .tier-badge-wall   { background: #ff6b9d; color: #fff; }
    .tier-badge-low    { background: #ffd93c; color: #1a0a2e; }
    .tier-badge-static { background: #8678a8; color: #1a0a2e; }
    .info .desc {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #bdaee3;
      margin-top: 6px;
    }
    .info .meta {
      font-family: monospace;
      font-size: 11px;
      color: #8678a8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>SCARY RUN — Monster Catalog</h1>
  <div class="sub">Wszyscy aktualni przeciwnicy w grze (od góry do dołu)</div>

  <div class="grid" id="grid"></div>

  <script>
    // [name, folder, frameCount, padDigits, tier, desc]
    const MONSTERS = [
      // === Goblin pack (już używane w grze) ===
      { group: 'Goblin Pack' },
      { name: 'Cyclops',  key: 'cyclops',  count: 8,  pad: 3, tier: 'wall', desc: 'Zielony jednooki — wymaga skoku' },
      { name: 'Warior',   key: 'warior',   count: 16, pad: 3, tier: 'mid',  desc: 'Gobliński wojownik z mieczem (run anim)' },
      { name: 'Bomber',   key: 'bomber',   count: 12, pad: 3, tier: 'high', desc: 'Latający goblin z bombą — slide' },
      { name: 'Archer',   key: 'archer',   count: 8,  pad: 2, tier: 'mid',  desc: 'Gobliński łucznik' },

      // === Cartoon Monsters (548470) ===
      { group: 'Cartoon Monsters' },
      { name: 'Cartoon M1', key: 'cartoon_M1', count: 10, pad: 2, tier: 'mid',  desc: 'Różowy okrągły z czułkami' },
      { name: 'Cartoon M2', key: 'cartoon_M2', count: 10, pad: 2, tier: 'mid',  desc: 'Żółto-różowy z koroną' },
      { name: 'Cartoon M3', key: 'cartoon_M3', count: 10, pad: 2, tier: 'mid',  desc: 'Żółw — slow, niski' },
      { name: 'Cartoon M4', key: 'cartoon_M4', count: 10, pad: 2, tier: 'high', desc: 'Nietoperz — lata!' },
      { name: 'Cartoon M5', key: 'cartoon_M5', count: 10, pad: 2, tier: 'mid',  desc: 'Niebieski jeż' },

      // === Funny Monsters (625577) ===
      { group: 'Funny Monsters' },
      { name: 'Funny M1', key: 'funny_M1', count: 10, pad: 2, tier: 'mid',  desc: 'Żółty z piórkami' },
      { name: 'Funny M2', key: 'funny_M2', count: 10, pad: 2, tier: 'mid',  desc: 'Różowo-biały w stroju' },
      { name: 'Funny M3', key: 'funny_M3', count: 10, pad: 2, tier: 'wall', desc: 'Niebieski rycerz — duży' },
      { name: 'Funny M4', key: 'funny_M4', count: 10, pad: 2, tier: 'mid',  desc: 'Szary z plecakiem' },
      { name: 'Funny M5', key: 'funny_M5', count: 10, pad: 2, tier: 'mid',  desc: 'Biały kreator' },

      // === Monster V7 (925935) ===
      { group: 'Monster V7' },
      { name: 'V7 M1', key: 'v7_M1', count: 10, pad: 2, tier: 'mid',  desc: 'Żółty zębaty' },
      { name: 'V7 M2', key: 'v7_M2', count: 10, pad: 2, tier: 'wall', desc: 'Niebieski z buzią — duży' },
      { name: 'V7 M3', key: 'v7_M3', count: 10, pad: 2, tier: 'mid',  desc: 'Fioletowy' },
      { name: 'V7 M4', key: 'v7_M4', count: 10, pad: 2, tier: 'wall', desc: 'Biały szkielet — duży' },
      { name: 'V7 M5', key: 'v7_M5', count: 10, pad: 2, tier: 'mid',  desc: 'Pomarańczowy z dziobem (krzyczy)' },

      // === Halloween Pack (NOWE) ===
      { group: 'Halloween (NOWE)' },
      { name: 'Necromancer 1', key: 'necromancer_1', count: 10, pad: 2, tier: 'mid',  desc: 'Czarny mag w czerwonej kapturze' },
      { name: 'Skeleton 1',    key: 'skeleton_1',    count: 10, pad: 2, tier: 'mid',  desc: 'Szkielet z kosą' },
      { name: 'Ghost 1',       key: 'ghost_1',       count: 10, pad: 2, tier: 'high', desc: 'Duch — lata, slide' },
      { name: 'Ghost 2',       key: 'ghost_2',       count: 10, pad: 2, tier: 'high', desc: 'Duch wariant 2 — lata' },
      { name: 'Ghost 3',       key: 'ghost_3',       count: 10, pad: 2, tier: 'high', desc: 'Duch wariant 3 — lata' },
      { name: 'Troll 1',       key: 'troll_1',       count: 10, pad: 2, tier: 'wall', desc: 'Wielki troll — jump_only' },
      { name: 'Troll 2',       key: 'troll_2',       count: 10, pad: 2, tier: 'wall', desc: 'Wielki troll wariant 2' },
      { name: 'Troll 3',       key: 'troll_3',       count: 10, pad: 2, tier: 'wall', desc: 'Wielki troll wariant 3' },
      { name: 'Premium Zombie 1', key: 'pzombie_1', count: 4,  pad: 2, tier: 'mid',  desc: 'Premium zombie' },
      { name: 'Premium Zombie 2', key: 'pzombie_2', count: 4,  pad: 2, tier: 'mid',  desc: 'Premium zombie wariant 2' },
      { name: 'Premium Zombie 3', key: 'pzombie_3', count: 4,  pad: 2, tier: 'mid',  desc: 'Premium zombie wariant 3' },
      { name: 'Zombie 01',     key: 'zombie_01',     count: 8,  pad: 2, tier: 'mid',  desc: 'Basic zombie (walk)' },
      { name: 'Zombie 02',     key: 'zombie_02',     count: 8,  pad: 2, tier: 'mid',  desc: 'Basic zombie wariant 2' },

      // === Statyczne (no animation) ===
      { group: 'Statyczne' },
      { name: 'Spikes',        key: 'spikes',         count: 1, tier: 'low',    static: true, file: 'spikes.webp', desc: 'Kolce — niskie, jump_only' },
      { name: 'Stone',         key: 'stone',          count: 1, tier: 'low',    static: true, file: 'stone.webp',  desc: 'Kamień — niski' },
      { name: 'Rock 01-08',    key: 'rocks',          count: 8, tier: 'low',    rock: true,                       desc: '8 wariantów rocków (random spawn)' },
      { name: 'Tombstone',     key: 'tombstone',      count: 1, tier: 'mid',    static: true, file: 'static/tombstone.webp', desc: 'Nagrobek — mid' },
      { name: 'Wooden Barrel', key: 'wooden_barrel',  count: 1, tier: 'mid',    static: true, file: 'wooden_barrel.webp', desc: 'Beczka' },
      { name: 'Wooden Box',    key: 'wooden_box',     count: 1, tier: 'mid',    static: true, file: 'wooden_box.webp', desc: 'Skrzynia' },
      { name: 'High Box Stack',key: 'high_box_stack', count: 1, tier: 'wall',   static: true, file: 'wooden_box.webp', desc: 'Stack 2 boxes — wall' },
      { name: 'Fence 01-02',   key: 'fences',         count: 2, tier: 'wall',   fence: true,                      desc: '2 ogrodzenia (random)' },
      { name: 'Flying Pumpkin',key: 'flying_pumpkin', count: 1, tier: 'high',   static: true, file: '../decoration/pumpkin.webp', desc: 'Latająca dynia — slide' },
    ];

    const grid = document.getElementById('grid');

    function tierLabel(t) {
      return ({ mid: 'MID • jump_or_slide', high: 'HIGH • slide_only', wall: 'WALL • jump_only', low: 'LOW • jump_only', static: 'STATIC' })[t] || t;
    }

    for (const m of MONSTERS) {
      if (m.group) {
        const h = document.createElement('div');
        h.className = 'group-header';
        h.textContent = m.group;
        grid.appendChild(h);
        continue;
      }
      const card = document.createElement('div');
      card.className = `card tier-${m.tier}`;

      const preview = document.createElement('div');
      preview.className = 'preview';
      const img = document.createElement('img');

      if (m.static) {
        img.src = `assets/tileset/obstacles/${m.file}`;
      } else if (m.rock) {
        img.src = `assets/tileset/obstacles/static/rock_01.webp`;
        // cyclic rock variant change
        let i = 1;
        setInterval(() => {
          i = (i % 8) + 1;
          img.src = `assets/tileset/obstacles/static/rock_${String(i).padStart(2, '0')}.webp`;
        }, 800);
      } else if (m.fence) {
        img.src = `assets/tileset/obstacles/static/fence_01.webp`;
        let i = 1;
        setInterval(() => {
          i = (i % 2) + 1;
          img.src = `assets/tileset/obstacles/static/fence_0${i}.webp`;
        }, 1000);
      } else {
        // Animated — frame sequence
        let frame = 0;
        const update = () => {
          const padded = String(frame).padStart(m.pad || 2, '0');
          img.src = `assets/tileset/obstacles/${m.key}/${padded}.webp`;
          frame = (frame + 1) % m.count;
        };
        update();
        setInterval(update, 100); // ~10fps
      }
      preview.appendChild(img);

      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `
        <div class="name">${m.name}</div>
        <span class="tier tier-badge-${m.tier}">${tierLabel(m.tier)}</span>
        <div class="desc">${m.desc}</div>
        <div class="meta">key: <code>${m.key}</code> • frames: ${m.count}</div>
      `;

      card.appendChild(preview);
      card.appendChild(info);
      grid.appendChild(card);
    }
  </script>
</body>
</html>
